# Unit tests for the alert rules: promtool test rules monitoring/tests/weather_test.yml
rule_files:
  - ../rules/weather.yml

evaluation_interval: 30s

tests:
  - name: one pod down, the other one up
    interval: 30s
    input_series:
      - series: 'up{job="weather", pod="weather-app-a", instance="10.0.11.1:5000"}'
        values: "1 1 0x10"
      - series: 'up{job="weather", pod="weather-app-b", instance="10.0.12.1:5000"}'
        values: "1x12"
    alert_rule_test:
      - eval_time: 1m30s           # down for 30 s only: still pending
        alertname: WeatherPodDown
        exp_alerts: []
      - eval_time: 3m
        alertname: WeatherPodDown
        exp_alerts:
          - exp_labels: {severity: critical, job: weather, pod: weather-app-a, instance: "10.0.11.1:5000"}
            exp_annotations:
              summary: "Weather pod weather-app-a does not answer"
              description: "Prometheus cannot scrape 10.0.11.1:5000 for more than 2 minutes."
      - eval_time: 5m
        alertname: WeatherAppMissing
        exp_alerts: []

  - name: all pods gone
    interval: 30s
    input_series:
      - series: 'up{job="weather", pod="weather-app-a", instance="10.0.11.1:5000"}'
        values: "0x12"
    alert_rule_test:
      - eval_time: 4m
        alertname: WeatherAppMissing
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "No weather pod is up"
              description: "Prometheus has not seen a single healthy weather pod for 3 minutes. The site is probably down."

  - name: 10% of requests fail
    interval: 30s
    input_series:
      - series: 'flask_http_request_total{job="weather", status="200"}'
        values: "0+27x30"
      - series: 'flask_http_request_total{job="weather", status="500"}'
        values: "0+3x30"
    alert_rule_test:
      - eval_time: 12m
        alertname: WeatherHigh5xxRate
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: "More than 5% of requests fail with 5xx"
              description: "Server error rate is 10% over the last 5 minutes."
