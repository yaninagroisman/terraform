# Provisioned datasource: created on every Grafana start, cannot be changed in the UI.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s   # = Prometheus scrape_interval, so $__rate_interval is never too short
