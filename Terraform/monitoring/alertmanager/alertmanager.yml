# Alertmanager: groups alerts from Prometheus and sends them to Slack.
# The webhook URL is read from a file that monitoring-sync fetches from Secrets Manager.
global:
  slack_api_url_file: /etc/alertmanager/secrets/slack-webhook-url
  resolve_timeout: 5m

route:
  receiver: slack
  group_by: [alertname]
  group_wait: 30s        # wait a little so several alerts of the same kind arrive as one message
  group_interval: 5m
  repeat_interval: 4h    # remind every 4 h while it is still firing

receivers:
  - name: slack
    slack_configs:
      - send_resolved: true
        title: '{{ if eq .Status "firing" }}:red_circle: FIRING{{ else }}:large_green_circle: RESOLVED{{ end }}: {{ .CommonLabels.alertname }}'
        text: |-
          {{ range .Alerts }}*{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          _severity: {{ .Labels.severity }}{{ if .Labels.pod }}, pod: {{ .Labels.pod }}{{ end }}_
          {{ end }}
