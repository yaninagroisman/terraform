apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-app
  namespace: weather

spec:
  replicas: 2

  selector:
    matchLabels:
      app: weather-app

  template:
    metadata:
      labels:
        app: weather-app

    spec:
      containers:
        - name: weather-app
          image: yaninagroisman/yanina_groisman:65
          imagePullPolicy: Always

          ports:
            - containerPort: 5000

          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: weather-secret
                  key: API_KEY