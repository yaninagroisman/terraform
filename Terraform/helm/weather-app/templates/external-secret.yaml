apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: weather-api-key
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: weather-secret
    creationPolicy: Orphan

  data:
    - secretKey: API_KEY
      remoteRef:
        key: infinity-weather/api-key
        