replicaCount: 2

image:
  repository: yaninagroisman/yanina_groisman
  tag: "65"
  pullPolicy: Always

service:
  type: NodePort
  port: 80
  targetPort: 5000
  nodePort: 30080

secret:
  name: weather-secret

config:
  flaskEnv: production
  port: "5000"

ingress:
  enabled: true
  className: alb
  host: weather.infinityweather.online
  scheme: internet-facing
  targetType: ip

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70