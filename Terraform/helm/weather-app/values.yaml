replicaCount: 2

image:
  repository: yaninagroisman/yanina_groisman
  tag: "65"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 5000

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits:   { memory: 256Mi }

secret:
  name: weather-secret

ingress:
  className: alb
  host: weather.<domain>
  scheme: internet-facing
  targetType: ip
  certificateArn: "arn:aws:acm:eu-north-1:060941289583:certificate/991089fb-d57c-41fa-a473-c448a0d802ff"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70